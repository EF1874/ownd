name: Release App

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'master'
    paths:
      - 'ownd-app/pubspec.yaml'
      - 'ownd-app/config/prod.json'
      - 'ownd-app/scripts/**'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      OWND_RELEASES_S3_ENDPOINT: ${{ secrets.OWND_RELEASES_S3_ENDPOINT }}
    defaults:
      run:
        working-directory: ownd-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION="${APP_VERSION%%+*}"
          VERSION_CODE="${APP_VERSION##*+}"
          if [ "$APP_VERSION" = "$VERSION_CODE" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "pubspec.yaml version must include a numeric build number, for example 2.0.7+207" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Detected Version: $VERSION"
          echo "Detected Version Code: $VERSION_CODE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.OWND_KEYSTORE_BASE64 }}" | base64 --decode > android/app/ownd-release-key.jks

      - name: Build APK
        shell: bash
        env:
          OWND_KEYSTORE_PASSWORD: ${{ secrets.OWND_KEYSTORE_PASSWORD }}
          OWND_KEY_ALIAS: ${{ secrets.OWND_KEY_ALIAS }}
          OWND_KEY_PASSWORD: ${{ secrets.OWND_KEY_PASSWORD }}
        run: |
          API_BASE_URL=$(jq -r '.OWND_API_BASE_URL' config/prod.json)
          flutter build apk --release --build-name=${{ steps.get_version.outputs.VERSION }} --build-number=${{ steps.get_version.outputs.VERSION_CODE }} --dart-define=OWND_API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ownd_v${{ steps.get_version.outputs.VERSION }}_universal.apk
          flutter build apk --split-per-abi --release --build-name=${{ steps.get_version.outputs.VERSION }} --build-number=${{ steps.get_version.outputs.VERSION_CODE }} --dart-define=OWND_API_BASE_URL="$API_BASE_URL"

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk/
          for file in app-*-release.apk; do
            ABI=$(echo $file | sed 's/app-\(.*\)-release.apk/\1/')
            mv "$file" "ownd_v${{ steps.get_version.outputs.VERSION }}_${ABI}.apk"
          done

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_CODE="${{ steps.get_version.outputs.VERSION_CODE }}"
          mkdir -p build/app-update

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
            CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...v${VERSION}"
          else
            COMMIT_RANGE="HEAD"
            CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/commits/v${VERSION}"
          fi

          {
            echo "## 本次更新"
            echo
            echo "- Android 版本：${VERSION}"
            echo "- 版本码：${VERSION_CODE}"
            echo
            echo "## 主要变更"
            echo
          } > build/app-update/release-notes.md

          FEATURES=$(git log "$COMMIT_RANGE" --pretty=format:'%s' | grep -E '^(feat|feature)(\(.+\))?!?: ' || true)
          FIXES=$(git log "$COMMIT_RANGE" --pretty=format:'%s' | grep -E '^fix(\(.+\))?!?: ' || true)
          OTHERS=$(git log "$COMMIT_RANGE" --pretty=format:'%s' | grep -Ev '^(feat|feature|fix)(\(.+\))?!?: ' || true)

          append_section() {
            local title="$1"
            local items="$2"
            if [ -z "$items" ]; then
              return
            fi
            echo "### ${title}" >> build/app-update/release-notes.md
            echo "$items" | sed -E 's/^[a-zA-Z]+(\([^)]+\))?!?: /- /' >> build/app-update/release-notes.md
            echo >> build/app-update/release-notes.md
          }

          append_section "新增功能" "$FEATURES"
          append_section "问题修复" "$FIXES"
          append_section "其他调整" "$OTHERS"

          {
            echo "## 完整记录"
            echo
            echo "${CHANGELOG_URL}"
          } >> build/app-update/release-notes.md

      - name: Generate app update manifest
        id: app_update_manifest
        shell: bash
        env:
          DOWNLOAD_BASE_URL: ${{ secrets.OWND_RELEASE_DOWNLOAD_BASE_URL }}
        run: |
          BASE_URL="${DOWNLOAD_BASE_URL:-https://download.ownd.cc/android}"
          BASE_URL="${BASE_URL%/}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_CODE="${{ steps.get_version.outputs.VERSION_CODE }}"
          mkdir -p build/app-update
          AAPT_PATH=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT_PATH" ]; then
            echo "Missing Android aapt tool" >&2
            exit 1
          fi
          ARTIFACTS_JSON='[]'
          for ABI in arm64-v8a armeabi-v7a x86_64 universal; do
            SOURCE_PATH="build/app/outputs/flutter-apk/ownd_v${VERSION}_${ABI}.apk"
            if [ ! -f "$SOURCE_PATH" ]; then
              continue
            fi
            APK_NAME="ownd-android-v${VERSION}+${VERSION_CODE}-${ABI}.apk"
            APK_SIZE=$(stat -c%s "$SOURCE_PATH")
            APK_SHA256=$(sha256sum "$SOURCE_PATH" | awk '{print $1}')
            APK_VERSION_CODE=$("$AAPT_PATH" dump badging "$SOURCE_PATH" | sed -n "s/.*versionCode='\([0-9]\+\)'.*/\1/p" | head -n 1)
            if [ -z "$APK_VERSION_CODE" ]; then
              echo "Missing APK versionCode for $SOURCE_PATH" >&2
              exit 1
            fi
            cp "$SOURCE_PATH" "build/app-update/$APK_NAME"
            ARTIFACTS_JSON=$(jq \
              --arg abi "$ABI" \
              --arg apkUrl "${BASE_URL}/releases/v${VERSION}/${APK_NAME}" \
              --argjson versionCode "$APK_VERSION_CODE" \
              --argjson apkSizeBytes "$APK_SIZE" \
              --arg sha256 "$APK_SHA256" \
              '. + [{
                abi: $abi,
                apkUrl: $apkUrl,
                versionCode: $versionCode,
                apkSizeBytes: $apkSizeBytes,
                sha256: $sha256
              }]' <<< "$ARTIFACTS_JSON")
          done
          UNIVERSAL_ARTIFACT=$(jq -c '.[] | select(.abi == "universal")' <<< "$ARTIFACTS_JSON")
          if [ -z "$UNIVERSAL_ARTIFACT" ]; then
            echo "Missing universal APK artifact" >&2
            exit 1
          fi
          jq -n \
            --arg platform "android" \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson universal "$UNIVERSAL_ARTIFACT" \
            --argjson artifacts "$ARTIFACTS_JSON" \
            --argjson releaseNotes "$(jq -R -s 'split("\n") | map(select(length > 0))' build/app-update/release-notes.md)" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              platform: $platform,
              version: $version,
              versionCode: $versionCode,
              forceUpdate: false,
              title: "发现新版本",
              apkUrl: $universal.apkUrl,
              apkSizeBytes: $universal.apkSizeBytes,
              sha256: $universal.sha256,
              artifacts: $artifacts,
              releaseNotes: $releaseNotes,
              publishedAt: $publishedAt,
              retention: {
                days: 7,
                maxVersions: 5
              }
            }' > build/app-update/latest.json
          echo "LATEST_APK_KEY=android/releases/v${VERSION}/ownd-android-v${VERSION}+${VERSION_CODE}-universal.apk" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          files: |
            ownd-app/build/app/outputs/flutter-apk/ownd_v*.apk
            ownd-app/build/app-update/latest.json
          body_path: ownd-app/build/app-update/release-notes.md
          generate_release_notes: true

      - name: Upload release assets to MinIO
        if: ${{ env.OWND_RELEASES_S3_ENDPOINT != '' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OWND_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OWND_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: true
          S3_ENDPOINT: ${{ secrets.OWND_RELEASES_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.OWND_RELEASES_BUCKET || 'ownd-releases' }}
        run: |
          aws s3api head-bucket \
            --bucket "$S3_BUCKET" \
            --endpoint-url "$S3_ENDPOINT" || \
            aws s3api create-bucket \
              --bucket "$S3_BUCKET" \
              --endpoint-url "$S3_ENDPOINT"
          jq -n --arg bucket "$S3_BUCKET" '{
            Version: "2012-10-17",
            Statement: [
              {
                Effect: "Allow",
                Principal: "*",
                Action: ["s3:GetObject"],
                Resource: ["arn:aws:s3:::\($bucket)/android/*"]
              }
            ]
          }' > /tmp/ownd-release-bucket-policy.json
          aws s3api put-bucket-policy \
            --bucket "$S3_BUCKET" \
            --policy file:///tmp/ownd-release-bucket-policy.json \
            --endpoint-url "$S3_ENDPOINT"
          for APK_FILE in build/app-update/*.apk; do
            APK_NAME=$(basename "$APK_FILE")
            aws s3 cp "$APK_FILE" "s3://${S3_BUCKET}/android/releases/v${{ steps.get_version.outputs.VERSION }}/${APK_NAME}" \
              --endpoint-url "$S3_ENDPOINT" \
              --content-type "application/vnd.android.package-archive"
          done
          aws s3 cp build/app-update/latest.json "s3://${S3_BUCKET}/android/latest.json" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache"

      - name: Cleanup old release assets
        if: ${{ env.OWND_RELEASES_S3_ENDPOINT != '' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OWND_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OWND_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: true
          S3_ENDPOINT: ${{ secrets.OWND_RELEASES_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.OWND_RELEASES_BUCKET || 'ownd-releases' }}
          APK_KEY: ${{ steps.app_update_manifest.outputs.LATEST_APK_KEY }}
        run: |
          aws s3api list-objects-v2 \
            --bucket "$S3_BUCKET" \
            --prefix "android/releases/" \
            --endpoint-url "$S3_ENDPOINT" > /tmp/ownd-release-objects.json
          node scripts/select-release-objects-to-delete.mjs \
            --latest-key "$APK_KEY" \
            --retention-days 7 \
            --max-versions 5 < /tmp/ownd-release-objects.json > /tmp/ownd-delete-objects.json
          DELETE_COUNT=$(jq '.Objects | length' /tmp/ownd-delete-objects.json)
          if [ "$DELETE_COUNT" -gt 0 ]; then
            aws s3api delete-objects \
              --bucket "$S3_BUCKET" \
              --delete file:///tmp/ownd-delete-objects.json \
              --endpoint-url "$S3_ENDPOINT"
          else
            echo "No old release assets to delete."
          fi
