name: Deploy Backend to Tencent Cloud

on:
  push:
    branches:
      - master
    paths:
      - 'ownd-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ownd-api/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd ownd-api
          pnpm install --frozen-lockfile

      - name: Generate Prisma Client and Build
        run: |
          cd ownd-api
          pnpm run prisma:generate
          pnpm test
          pnpm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            if [ -d "$HOME/ownd-full-stack" ]; then
              cd "$HOME/ownd-full-stack"
            elif [ -d "$HOME/ownd" ]; then
              cd "$HOME/ownd"
            else
              echo "Cloning repository..."
              git clone https://github.com/EF1874/ownd.git "$HOME/ownd"
              cd "$HOME/ownd"
            fi
            
            if ! git diff --quiet; then
              backup_dir="$HOME/ownd-deploy-backups/$(date +%Y%m%d%H%M%S)"
              mkdir -p "$backup_dir"
              git status --short > "$backup_dir/status.txt"
              git diff --binary > "$backup_dir/tracked-changes.patch"
              echo "Backed up local tracked changes to $backup_dir"
            fi

            git fetch origin master
            git reset --hard origin/master
            echo "Deploying commit $(git rev-parse --short HEAD)"
            
            cd ownd-api
            if ! grep -q '^APP_UPDATE_ANDROID_MANIFEST_URL=' .env.production; then
              echo 'APP_UPDATE_ANDROID_MANIFEST_URL=https://download.ownd.cc/android/latest.json' >> .env.production
            fi
            # Rebuild and restart docker compose containers
            sudo docker compose -f docker-compose.prod.yaml up -d --build
            
            # Clean unused images to save disk space
            sudo docker image prune -f
