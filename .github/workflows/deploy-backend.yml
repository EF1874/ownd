name: Deploy Backend to Tencent Cloud

on:
  push:
    branches:
      - master
    paths:
      - 'ownd-api/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ownd-api/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd ownd-api
          pnpm install --frozen-lockfile

      - name: Generate Prisma Client and Build
        run: |
          cd ownd-api
          pnpm run prisma:generate
          # If you have unit tests, you can run them here
          # pnpm test
          pnpm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/ownd-full-stack
            
            # Pull latest code
            git pull origin master
            
            cd ownd-api
            # Rebuild and restart docker compose containers
            docker compose -f docker-compose.prod.yaml up -d --build
            
            # Clean unused images to save disk space
            docker image prune -f
