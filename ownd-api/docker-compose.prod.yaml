services:
  api:
    build:
      context: .
    container_name: ownd-api
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - '3000'

  postgres:
    image: postgres:16-alpine
    container_name: ownd-postgres-prod
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ownd-redis-prod
    restart: unless-stopped
    expose:
      - '6379'

  minio:
    image: minio/minio
    container_name: ownd-minio-prod
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    command: server /data --console-address ':9001'
    volumes:
      - minio_data_prod:/data
    expose:
      - '9000'
      - '9001'

  caddy:
    image: caddy:2-alpine
    container_name: ownd-caddy-prod
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - minio

volumes:
  postgres_data_prod:
  minio_data_prod:
  caddy_data_prod:
  caddy_config_prod:


